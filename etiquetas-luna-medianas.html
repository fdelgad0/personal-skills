<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Etiquetas Medianas - Luna Natalia Delgado Marmolejo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
    }

    @page {
      size: letter;
      margin: 10mm; /* Standard safe margin for macOS print drivers */
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: #f0f2f5;
      font-family: 'Nunito', sans-serif;
      display: flex;
      justify-content: center;
    }

    .sheet {
      width: 100%;
      max-width: 195mm; /* Fits inside printable Letter width */
      background: white;
      padding: 0;
    }

    .section-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 11pt;
      color: #7E57C2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 3mm 0;
      border-bottom: 2px dashed #D1C4E9;
      padding-bottom: 2px;
      text-align: center;
    }

    .medium-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3mm 4mm;
    }

    .card-medium {
      height: 31.5mm; /* Tightened height so 7 rows fit on 1 page */
      border-radius: 12px;
      border: 2px dashed;
      padding: 2mm 3mm;
      display: flex;
      align-items: center;
      position: relative;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .bg-lilac { background-color: #F3E5F5; border-color: #AB47BC; }
    .bg-mint  { background-color: #E0F2F1; border-color: #26A69A; }
    .bg-pink  { background-color: #FCE4EC; border-color: #EC407A; }
    .bg-blue  { background-color: #E1F5FE; border-color: #29B6F6; }

    .card-medium svg {
      flex-shrink: 0;
    }

    .card-medium .content {
      margin-left: 3mm;
      flex-grow: 1;
      overflow: hidden;
    }

    .card-medium .title {
      font-family: 'Fredoka', sans-serif;
      font-size: 11.5pt;
      font-weight: 700;
      color: #311B92;
      line-height: 1.1;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .card-medium .subtext {
      font-size: 8.5pt;
      font-weight: 800;
      color: #455A64;
      line-height: 1.2;
      margin-top: 2px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .card-medium .field {
      font-family: 'Fredoka', sans-serif;
      font-size: 8.5pt;
      color: #311B92;
      margin-top: 4px;
    }

    .card-medium .line {
      display: inline-block;
      width: 90px;
      border-bottom: 1.5px solid #311B92;
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .sheet {
        box-shadow: none;
        border: none;
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="sheet">
  <div class="section-title">Etiquetas Medianas • Cuadernos, Libros y Mochila</div>

  <div class="medium-grid">
    <script>
      const styles = [
        { bg: 'bg-lilac', stroke: '#4A148C', fill: '#E1BEE7', eye: '#7C4DFF', accent: '#FF4081' },
        { bg: 'bg-mint',  stroke: '#004D40', fill: '#B2DFDB', eye: '#00897B', accent: '#FF4081' },
        { bg: 'bg-pink',  stroke: '#880E4F', fill: '#F8BBD0', eye: '#FF4081', accent: '#D81B60' },
        { bg: 'bg-blue',  stroke: '#01579B', fill: '#B3E5FC', eye: '#0288D1', accent: '#FF4081' }
      ];

      for(let i = 0; i < 14; i++) {
        const s = styles[i % 4];
        document.write(`
          <div class="card-medium ${s.bg}">
            <svg width="58" height="58" viewBox="0 0 100 100">
              <polygon points="22,30 10,6 36,18" fill="${s.fill}" stroke="${s.stroke}" stroke-width="2.5"/>
              <polygon points="23,26 15,10 32,18" fill="#FF80AB"/>
              <polygon points="78,30 90,6 64,18" fill="${s.fill}" stroke="${s.stroke}" stroke-width="2.5"/>
              <polygon points="77,26 85,10 68,18" fill="#FF80AB"/>
              
              <ellipse cx="50" cy="48" rx="34" ry="28" fill="${s.fill}" stroke="${s.stroke}" stroke-width="2.5"/>
              
              <ellipse cx="36" cy="46" rx="7" ry="10" fill="${s.stroke}"/>
              <ellipse cx="36" cy="49" rx="5" ry="6" fill="${s.eye}"/>
              <circle cx="34" cy="42" r="3" fill="white"/>
              
              <ellipse cx="64" cy="46" rx="7" ry="10" fill="${s.stroke}"/>
              <ellipse cx="64" cy="49" rx="5" ry="6" fill="${s.eye}"/>
              <circle cx="62" cy="42" r="3" fill="white"/>
              
              <polygon points="50,52 48,50 52,50" fill="${s.accent}"/>
              <path d="M 45,54 Q 48,57 50,54 Q 52,57 55,54" stroke="#212121" stroke-width="2" fill="none"/>
              <ellipse cx="26" cy="54" rx="6" ry="3.5" fill="${s.accent}" opacity="0.4"/>
              <ellipse cx="74" cy="54" rx="6" ry="3.5" fill="${s.accent}" opacity="0.4"/>
            </svg>
            <div class="content">
              <div class="title">Luna Natalia Delgado Marmolejo</div>
              <div class="subtext">4to de Primaria • CEC - Ignacio Luis Vallarta</div>
              <div class="field">Materia: <span class="line"></span></div>
            </div>
          </div>
        `);
      }
    </script>
  </div>
</div>

</body>
</html>
