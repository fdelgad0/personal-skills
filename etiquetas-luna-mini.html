<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Etiquetas Mini - Luna Natalia Delgado Marmolejo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
    }

    @page {
      size: letter;
      margin: 5mm;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
      font-family: 'Nunito', sans-serif;
      display: flex;
      justify-content: center;
    }

    .sheet {
      width: 205.9mm;
      height: 269.4mm;
      background: white;
      padding: 5mm;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .section-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 11pt;
      color: #7E57C2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 4mm 0;
      border-bottom: 2px dashed #D1C4E9;
      padding-bottom: 2px;
      text-align: center;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.8mm;
    }

    .card-mini {
      height: 16mm;
      border-radius: 6px;
      border: 1.2px solid;
      padding: 1mm 1.5mm;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .bg-lilac { background-color: #F3E5F5; border-color: #AB47BC; }
    .bg-mint  { background-color: #E0F2F1; border-color: #26A69A; }
    .bg-pink  { background-color: #FCE4EC; border-color: #EC407A; }
    .bg-blue  { background-color: #E1F5FE; border-color: #29B6F6; }

    .card-mini svg {
      flex-shrink: 0;
    }

    .card-mini .content {
      margin-left: 1.5mm;
      line-height: 1.1;
      overflow: hidden;
      white-space: nowrap;
    }

    .card-mini .title {
      font-family: 'Fredoka', sans-serif;
      font-size: 7.5pt;
      font-weight: 700;
      color: #1A237E;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .card-mini .subtext {
      font-size: 5.8pt;
      font-weight: 800;
      color: #37474F;
      text-overflow: ellipsis;
      overflow: hidden;
      margin-top: 1px;
    }

    @media print {
      body { background: none; }
      .sheet { box-shadow: none; border: none; padding: 0; width: 100%; height: 100%; }
    }
  </style>
</head>
<body>

<div class="sheet">
  <div class="section-title">Etiquetas Mini • Lápices, Colores y Útiles Pequeños</div>

  <div class="mini-grid">
    <script>
      const bgClasses = ['bg-lilac', 'bg-mint', 'bg-pink', 'bg-blue'];
      const strokeColors = ['#4A148C', '#004D40', '#880E4F', '#01579B'];
      const eyeFills = ['#7C4DFF', '#00897B', '#FF4081', '#0288D1'];
      const fills = ['#E1BEE7', '#B2DFDB', '#F8BBD0', '#B3E5FC'];

      for(let i = 0; i < 56; i++) {
        const idx = i % 4;
        document.write(`
          <div class="card-mini ${bgClasses[idx]}">
            <svg width="24" height="24" viewBox="0 0 60 60">
              <polygon points="12,18 5,3 21,11" fill="${fills[idx]}" stroke="${strokeColors[idx]}" stroke-width="1.8"/>
              <polygon points="13,15 8,6 19,11" fill="#FF80AB"/>
              <polygon points="48,18 55,3 39,11" fill="${fills[idx]}" stroke="${strokeColors[idx]}" stroke-width="1.8"/>
              <polygon points="47,15 52,6 41,11" fill="#FF80AB"/>
              
              <ellipse cx="30" cy="31" rx="22" ry="18" fill="${fills[idx]}" stroke="${strokeColors[idx]}" stroke-width="1.8"/>
              
              <ellipse cx="21" cy="30" rx="4.5" ry="6" fill="${strokeColors[idx]}"/>
              <ellipse cx="21" cy="32" rx="3" ry="4" fill="${eyeFills[idx]}"/>
              <circle cx="19.5" cy="27.5" r="2" fill="white"/>
              
              <ellipse cx="39" cy="30" rx="4.5" ry="6" fill="${strokeColors[idx]}"/>
              <ellipse cx="39" cy="32" rx="3" ry="4" fill="${eyeFills[idx]}"/>
              <circle cx="37.5" cy="27.5" r="2" fill="white"/>
              
              <path d="M 27,35 Q 30,38 30,35 Q 30,38 33,35" stroke="#212121" stroke-width="1.2" fill="none"/>
              <ellipse cx="14" cy="35" rx="3.5" ry="2" fill="#FF4081" opacity="0.5"/>
              <line x1="12" y1="34" x2="11" y2="37" stroke="#FF1744" stroke-width="1"/>
              
              <ellipse cx="46" cy="35" rx="3.5" ry="2" fill="#FF4081" opacity="0.5"/>
              <line x1="48" y1="34" x2="47" y2="37" stroke="#FF1744" stroke-width="1"/>

              <line x1="9" y1="30" x2="3" y2="29" stroke="${strokeColors[idx]}" stroke-width="1"/>
              <line x1="9" y1="33" x2="3" y2="34" stroke="${strokeColors[idx]}" stroke-width="1"/>
              <line x1="51" y1="30" x2="57" y2="29" stroke="${strokeColors[idx]}" stroke-width="1"/>
              <line x1="51" y1="33" x2="57" y2="34" stroke="${strokeColors[idx]}" stroke-width="1"/>
            </svg>
            <div class="content">
              <div class="title">Luna Natalia Delgado M.</div>
              <div class="subtext">4to Primaria • CEC - Vallarta</div>
            </div>
          </div>
        `);
      }
    </script>
  </div>
</div>

</body>
</html>
